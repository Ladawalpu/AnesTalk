<style>
*{-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header (search + syringe-label category strip) over a single column of phrase cards; tap a card for a large "show the patient" view. */
:root{
  --bg:#f3f6f7; --surface:#ffffff; --fg:#14232a; --muted:#5b6c73; --line:#d9e2e5;
  --accent:#0b5563; --accent-ink:#ffffff; --accent-soft:#e1eef0; --star:#c98a00;
  --en:"Atkinson Hyperlegible",system-ui,sans-serif;
  --th:"IBM Plex Sans Thai Looped","Noto Sans Thai",Tahoma,sans-serif;
  /* ISO 26825 syringe-label colours, used as category markers */
  --c-greet:#7cb342; --c-id:#9aa7ad; --c-hx:#b48fd6; --c-npo:#e8907c; --c-ga:#f2d100;
  --c-spinal:#8f9799; --c-block:#f08a00; --c-or:#e0434f; --c-pacu:#4fb3df;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1619; --surface:#16232a; --fg:#e6eef0; --muted:#98abb1; --line:#2a3a41;
  --accent:#5cc2cf; --accent-ink:#06242a; --accent-soft:#18363c; --star:#f2c14e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1619; --surface:#16232a; --fg:#e6eef0; --muted:#98abb1; --line:#2a3a41;
  --accent:#5cc2cf; --accent-ink:#06242a; --accent-soft:#18363c; --star:#f2c14e; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--th);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{margin:0;font-family:var(--en);font-size:22px;letter-spacing:-.01em;text-wrap:balance}
h1{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:11px;background:#fff;border:1px solid var(--line);flex-shrink:0}
h1 small{font-family:var(--th);font-weight:500;font-size:13px;color:var(--muted);margin-left:6px}
.speed{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-shrink:0}
.speed button{border:0;background:none;color:var(--muted);font:600 12px var(--th);padding:6px 11px;cursor:pointer}
.speed button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.search{position:relative}
.search input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:10px 12px 10px 36px;font:15px var(--th)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.cats::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:6px 10px 6px 6px;font:500 13px var(--th);cursor:pointer;white-space:nowrap}
.chip i{width:6px;height:20px;border-radius:2px;background:var(--c)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg);font-weight:600}
.chip:focus-visible,.card:focus-visible,.icon:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main .wrap{padding-block:14px 40px;display:flex;flex-direction:column;gap:18px}
.group h2{margin:0 0 8px;font:600 12px var(--th);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.group h2 i{width:18px;height:6px;border-radius:2px;background:var(--c)}
.list{display:flex;flex-direction:column;gap:8px}
.card{display:grid;grid-template-columns:1fr auto;gap:4px 10px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:11px 10px 11px 13px;cursor:pointer;text-align:left;color:var(--fg);font:inherit;width:100%}
.card .txt{min-width:0;display:flex;flex-direction:column;gap:3px}
.en{font-family:var(--en);font-size:17px;line-height:1.35;font-weight:700}
.th{font-size:14px;color:var(--muted)}
.note{font-size:12px;color:var(--accent);font-weight:500}
.acts{display:flex;flex-direction:column;gap:4px}
.icon{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--accent);display:grid;place-items:center;cursor:pointer}
.icon.star[aria-pressed="true"]{color:var(--star)}
.icon.star[aria-pressed="true"] svg{fill:currentColor}
.empty{color:var(--muted);text-align:center;padding:30px 0}

/* Patient view */
.show{position:fixed;inset:0;z-index:20;background:var(--surface);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(20px,env(safe-area-inset-left,0px))}
.show .bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.show .tag{display:flex;align-items:center;gap:8px;font:600 13px var(--th);color:var(--muted)}
.show .tag i{width:22px;height:8px;border-radius:2px;background:var(--c)}
.show .body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:760px;margin:0 auto;width:100%;overflow-y:auto}
.show .big{font-family:var(--en);font-weight:700;font-size:clamp(26px,7vw,44px);line-height:1.25;text-wrap:balance}
.show .small{font-size:17px;color:var(--muted)}
.show .foot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:13px 20px;font:600 16px var(--th);cursor:pointer;display:flex;align-items:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.scale div{border-radius:6px;padding:10px 0 6px;text-align:center;font:700 18px var(--en);color:#14232a;font-variant-numeric:tabular-nums}
.scale span{display:block;font:500 10px var(--th);margin-top:2px}
.scale-lbl{display:flex;justify-content:space-between;font:600 13px var(--en);color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30}
@media (prefers-reduced-motion:no-preference){.show{animation:up .18s ease-out}@keyframes up{from{opacity:.4;transform:translateY(12px)}}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <h1><img class="logo" alt="" src="icon-96.png"><span>AnesTalk <small>ไทย → English สำหรับวิสัญญี</small></span></h1>
      <div class="speed" role="group" aria-label="ความเร็วเสียง">
        <button id="sp-n" aria-pressed="true">ปกติ</button>
        <button id="sp-s" aria-pressed="false">ช้า</button>
      </div>
    </div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="ค้นหา ไทย หรือ English เช่น แพ้ยา, pain" autocomplete="off">
    </label>
    <nav class="cats" id="cats" aria-label="หมวด"></nav>
  </div>
</header>
<main><div class="wrap" id="out"></div></main>
<div class="show" id="show" hidden></div>

const $=s=>document.querySelector(s);
const catOf=id=>CATS.find(c=>c.id===id);
let cat="greet", rate=0.9, favs=new Set();
try{favs=new Set(JSON.parse(localStorage.getItem("anestalk-fav")||"[]"))}catch(e){}
try{const c=localStorage.getItem("anestalk-cat");if(c&&catOf(c))cat=c}catch(e){}
const key=p=>p[2];
const saveFav=()=>{try{localStorage.setItem("anestalk-fav",JSON.stringify([...favs]))}catch(e){}};

const ICON_SPK='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
const ICON_STAR='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.4 6.5 20.3l1-6.2L3 9.7l6.2-.9z"/></svg>';

let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices();voice=v.find(x=>/en[-_]US/i.test(x.lang)&&/Samantha|Google|Aria|Jenny/i.test(x.name))||v.find(x=>/en[-_](US|GB)/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}
if("speechSynthesis"in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(t){
  if(!("speechSynthesis"in window)){toast("อุปกรณ์นี้ไม่รองรับการอ่านออกเสียง");return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t.replace(/_{2,}/g,"…"));
  u.lang="en-US";u.rate=rate;if(voice)u.voice=voice;speechSynthesis.speak(u);
}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}

function renderCats(){
  $("#cats").innerHTML=CATS.map(c=>`<button class="chip" style="--c:${c.c}" data-c="${c.id}" aria-pressed="${c.id===cat&&!$("#q").value}"><i></i>${c.th}${c.id==="fav"?` (${favs.size})`:""}</button>`).join("");
}
function card(p,i){
  const c=catOf(p[0]),f=favs.has(key(p));
  return `<div class="card" role="button" tabindex="0" style="--c:${c.c}" data-i="${i}">
    <div class="txt"><div class="en" lang="en">${p[2]}</div><div class="th">${p[1]}</div>${p[3]?`<div class="note">${p[3]}</div>`:""}</div>
    <div class="acts"><button class="icon spk" aria-label="ฟังเสียง" data-i="${i}">${ICON_SPK}</button>
    <button class="icon star" aria-label="บันทึก" aria-pressed="${f}" data-i="${i}">${ICON_STAR}</button></div></div>`;
}
function render(){
  renderCats();
  const q=$("#q").value.trim().toLowerCase();
  let items=P.map((p,i)=>[p,i]);
  let html="";
  if(q){
    items=items.filter(([p])=>(p[1]+" "+p[2]+" "+(p[3]||"")).toLowerCase().includes(q));
    const groups=CATS.filter(c=>c.id!=="fav").map(c=>[c,items.filter(([p])=>p[0]===c.id)]).filter(g=>g[1].length);
    html=groups.map(([c,its])=>`<section class="group" style="--c:${c.c}"><h2><i></i>${c.th}</h2><div class="list">${its.map(([p,i])=>card(p,i)).join("")}</div></section>`).join("")
      ||`<p class="empty">ไม่พบคำว่า “${q.replace(/[<>&"]/g,"")}”</p>`;
  }else if(cat==="fav"){
    items=items.filter(([p])=>favs.has(key(p)));
    html=items.length?`<div class="list">${items.map(([p,i])=>card(p,i)).join("")}</div>`:`<p class="empty">กดดาว ☆ ที่ประโยคที่ใช้บ่อย เพื่อเก็บไว้ที่นี่</p>`;
  }else{
    html=`<div class="list">${items.filter(([p])=>p[0]===cat).map(([p,i])=>card(p,i)).join("")}</div>`;
  }
  $("#out").innerHTML=html;
}
function openShow(i){
  const p=P[i],c=catOf(p[0]),s=$("#show");
  s.style.setProperty("--c",c.c);
  const scale=p[4]==="scale"?`<div class="scale-lbl"><span>No pain</span><span>Worst pain</span></div><div class="scale">${Array.from({length:11},(_,n)=>{const h=120-n*12;return `<div style="background:hsl(${h} 70% ${n>7?62:58}%)">${n}</div>`}).join("")}</div>`:"";
  s.innerHTML=`<div class="bar"><span class="tag"><i></i>${c.th}</span><button class="btn ghost" id="close">ปิด</button></div>
    <div class="body"><div class="big" lang="en">${p[2]}</div>${scale}<div class="small">${p[1]}</div></div>
    <div class="foot"><button class="btn primary" id="say">${ICON_SPK} ฟังเสียง</button><button class="btn ghost" id="copy">คัดลอก</button></div>`;
  s.hidden=false;
  $("#close").onclick=()=>{s.hidden=true;speechSynthesis?.cancel()};
  $("#say").onclick=()=>speak(p[2]);
  $("#copy").onclick=()=>{navigator.clipboard?.writeText(p[2]).then(()=>toast("คัดลอกแล้ว"),()=>toast("คัดลอกไม่ได้ กดค้างที่ข้อความเพื่อเลือก"))};
  $("#close").focus();
}

$("#cats").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;cat=b.dataset.c;$("#q").value="";try{localStorage.setItem("anestalk-cat",cat)}catch(x){}render();window.scrollTo({top:0})});
$("#q").addEventListener("input",render);
$("#out").addEventListener("click",e=>{
  const sp=e.target.closest(".spk"),st=e.target.closest(".star"),cd=e.target.closest(".card");
  if(sp){e.stopPropagation();speak(P[sp.dataset.i][2]);return}
  if(st){e.stopPropagation();const k=key(P[st.dataset.i]);favs.has(k)?favs.delete(k):favs.add(k);saveFav();st.setAttribute("aria-pressed",favs.has(k));renderCats();if(cat==="fav"&&!$("#q").value)render();return}
  if(cd)openShow(+cd.dataset.i);
});
$("#out").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("card")){e.preventDefault();openShow(+e.target.dataset.i)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#show").hidden)$("#close").click()});
const setRate=(r,on,off)=>{rate=r;$(on).setAttribute("aria-pressed","true");$(off).setAttribute("aria-pressed","false")};
$("#sp-n").onclick=()=>setRate(0.9,"#sp-n","#sp-s");
$("#sp-s").onclick=()=>setRate(0.6,"#sp-s","#sp-n");
render();
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
</script>
</body>
</html>
